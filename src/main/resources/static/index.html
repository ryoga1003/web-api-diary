<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>短文日記</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
    <h1>📔 短文日記</h1>
    <p class="subtitle">今日の一言を、100文字以内で残そう。</p>
</header>

<main class="container">

    <div id="error-message" class="error" role="alert"></div>

    <section class="card">
        <h2>今日の一言</h2>
        <form id="diary-form">
            <input type="hidden" id="edit-id">
            <textarea id="content" rows="3" maxlength="100" placeholder="今日あったことを書いてみよう" required></textarea>
            <div class="form-footer">
                <span class="counter"><span id="count">0</span> / 100</span>
                <div class="button-group">
                    <button type="button" id="cancel-btn" class="btn btn-secondary" hidden>編集をやめる</button>
                    <button type="submit" id="submit-btn" class="btn btn-primary">日記を保存</button>
                </div>
            </div>
        </form>
    </section>

    <section class="card">
        <div class="card-header">
            <h2>日記一覧</h2>
            <button type="button" id="reload-btn" class="btn btn-secondary btn-small">一覧を更新</button>
        </div>
        <div id="diary-list"></div>
    </section>

    <section class="card">
        <h2>ID指定で1件取得</h2>
        <div class="search-row">
            <input type="number" id="search-id" placeholder="日記ID">
            <button type="button" id="search-btn" class="btn btn-primary">取得</button>
        </div>
        <div id="search-result"></div>
    </section>

</main>

<script src="app.js"></script>
</body>
</html>
